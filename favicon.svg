<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Valiva</title>
  <desc id="desc">A folded turquoise and teal V ribbon on a deep navy rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263f56"/>
      <stop offset="0.52" stop-color="#1b3043"/>
      <stop offset="1" stop-color="#172b3b"/>
    </linearGradient>
    <linearGradient id="leftRibbon" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#08d9ca"/>
      <stop offset="0.48" stop-color="#00cbb7"/>
      <stop offset="1" stop-color="#00bda7"/>
    </linearGradient>
    <linearGradient id="topRibbon" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#05d6b4"/>
      <stop offset="0.48" stop-color="#00b998"/>
      <stop offset="1" stop-color="#087e6d"/>
    </linearGradient>
    <linearGradient id="rightRibbon" x1="0.18" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#04cdb5"/>
      <stop offset="0.42" stop-color="#00b99f"/>
      <stop offset="1" stop-color="#087e70"/>
    </linearGradient>
    <linearGradient id="rightHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13e0ca" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#13e0ca" stop-opacity="0"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dy="12" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.34"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="56" y="56" width="912" height="912" rx="178" fill="url(#background)"/>
  <rect x="57.5" y="57.5" width="909" height="909" rx="176.5" fill="none" stroke="#6b92a6" stroke-opacity="0.13" stroke-width="3"/>

  <!-- Folded ribbon mark: rear fold first, then the right stroke, then the front left stroke. -->
  <g filter="url(#logoShadow)">
    <!-- Short upper fold of the continuous ribbon -->
    <path d="M 435 193
             L 732 193
             L 675 322
             Q 668 338 650 338
             L 490 338
             Q 467 338 457 315
             Z" fill="url(#topRibbon)"/>

    <!-- Right-hand descending stroke -->
    <path d="M 732 193
             L 807 298
             Q 818 314 810 334
             L 622 843
             L 545 631
             L 675 338
             Z" fill="url(#rightRibbon)"/>
    <path d="M 732 193 L 807 298 Q 818 314 810 334 L 622 843 L 583 736 L 759 323 Z"
          fill="url(#rightHighlight)" opacity="0.30"/>

    <!-- Front left stroke, ending in the sharp lower V point -->
    <path d="M 202 193
             L 323 193
             Q 355 193 370 225
             L 625 843
             L 480 843
             Q 460 843 449 820
             L 184 214
             Q 177 193 202 193
             Z" fill="url(#leftRibbon)"/>
  </g>
</svg>